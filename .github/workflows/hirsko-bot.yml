name: HIRAKO TikTok Bot

on:
  schedule:
    # Jalan SETIAP MENIT untuk respon cepat dan auto restart
    - cron: '*/1 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-hirako-bot:
    name: HIRAKO Bot
    runs-on: ubuntu-latest
    timeout-minutes: 2  # 2 menit cukup karena proses cepat
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 urllib3
      
      - name: Run HIRAKO Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          python hirako_bot_actions.py
      
      - name: Commit and Push Changes
        if: success() || failure()
        run: |
          git config --global user.name "Hirako Bot"
          git config --global user.email "bot@hirako.com"
          git add links.txt bot_state.json offset.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "🤖 Auto-save by Hirako Bot [skip ci]" || true
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main || true

name: Keep Alive - Restart if Dead

on:
  schedule:
    - cron: '*/5 * * * *'  # Cek setiap 5 menit
  workflow_dispatch:

jobs:
  check-and-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    
    steps:
      - name: Check if bot is working
        run: |
          echo "✅ Keep alive check at $(date)"
          echo "Main workflow akan jalan otomatis setiap menit"
